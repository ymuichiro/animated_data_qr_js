  <head>

    <title>Animated Data QR Demo</title>
    <link rel="stylesheet" href="./assets/demo.css" />

  <body>
    <div class="wrap">
      <nav class="topnav">

      </nav>

      <section class="panel">
        <h1>Animated Data QR Demo</h1>
        <p>
          ブラウザ間オフラインファイル転送のデモページです。送信側で animated QR を表示し、
          受信側でカメラ読み取りして復元できます。
        </p>
        <ol>
          <li><code>/sender</code> を別タブまたは別端末で開く</li>

          <li>受信完了後にダウンロードリンクから復元ファイルを保存する</li>
        </ol>
        <p class="muted">
          Note: 公開 URL は <code>https://&lt;username&gt;.github.io/&lt;repo&gt;/</code> 形式です。
        </p>
