name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package and Pages artifact
        run: npm run build:pages

      - name: Publish site to gh-pages
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add /tmp/gh-pages origin/gh-pages
            cd /tmp/gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git worktree add -B gh-pages /tmp/gh-pages
            cd /tmp/gh-pages
          fi

          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/site/." /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll

          cd /tmp/gh-pages
          git add --all

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin HEAD:gh-pages --force
