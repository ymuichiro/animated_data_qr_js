<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated QR Sender</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f7f7f7;
        color: #111;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px;
      }
      #qrCanvas {
        border: 1px solid #ddd;
        width: 100%;
        max-width: 560px;
        background: #fff;
      }
      .row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      button {
        padding: 10px 16px;
      }
      code {
        background: #fff;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>送信モード</h1>
      <p>ファイルを選択して animated QR を開始します。</p>
      <div class="row">
        <input id="fileInput" type="file" />
      </div>
      <div class="row">
        <label>
          Preset:
          <select id="presetSelect">
            <option value="compatibility" selected>compatibility</option>
            <option value="balanced">balanced</option>
            <option value="throughput">throughput</option>
            <option value="resilient">resilient</option>
          </select>
        </label>
        <label>Chunk bytes: <input id="chunkSizeInput" type="number" value="220" min="32" max="1024" /></label>
        <label>Frame ms: <input id="frameMsInput" type="number" value="250" min="60" max="2000" /></label>
        <label>Symbols/frame: <input id="symbolsPerFrameInput" type="number" value="1" min="1" max="4" /></label>
        <label>Parity block: <input id="parityBlockInput" type="number" value="0" min="0" max="64" /></label>
        <label>
          EC:
          <select id="ecLevelSelect">
            <option value="L">L</option>
            <option value="M" selected>M</option>
            <option value="Q">Q</option>
            <option value="H">H</option>
          </select>
        </label>
      </div>
      <div class="row">
        <button id="prepareBtn">Prepare</button>
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
      </div>
      <p id="status">status: idle</p>
      <canvas id="qrCanvas"></canvas>
      <p>受信側は <code>examples/receiver.html</code> を開いてカメラ読取してください。</p>
    </main>

    <script type="module">
      import {
        AnimatedQrSender,
        resolveTransferPreset
      } from "../dist/animated-data-qr.esm.js";

      const fileInput = document.getElementById("fileInput");
      const presetSelect = document.getElementById("presetSelect");
      const chunkSizeInput = document.getElementById("chunkSizeInput");
      const frameMsInput = document.getElementById("frameMsInput");
      const symbolsPerFrameInput = document.getElementById("symbolsPerFrameInput");
      const parityBlockInput = document.getElementById("parityBlockInput");
      const ecLevelSelect = document.getElementById("ecLevelSelect");
      const prepareBtn = document.getElementById("prepareBtn");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const status = document.getElementById("status");
      const canvas = document.getElementById("qrCanvas");

      let sender = null;

      function formatDuration(ms) {
        const totalSeconds = Math.ceil(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
          return `${hours}h ${minutes}m ${seconds}s`;
        }
        if (minutes > 0) {
          return `${minutes}m ${seconds}s`;
        }
        return `${seconds}s`;
      }

      function createPreparedSummary(payload) {
        return `prepared: ${payload.fileName}, chunks=${payload.totalChunks}, symbols/frame=${payload.symbolsPerFrame}, parity=${payload.parityBlockDataChunks || 0}, 1 loop=${formatDuration(payload.estimatedStats.loopDurationMs)}, ~${Math.round(payload.estimatedStats.bytesPerSecond)} B/s`;
      }

      function applyPreset(name) {
        const preset = resolveTransferPreset(name);
        chunkSizeInput.value = String(preset.chunkByteSize);
        frameMsInput.value = String(preset.frameIntervalMs);
        symbolsPerFrameInput.value = String(preset.symbolsPerFrame || 1);
        parityBlockInput.value = String(preset.parityBlockDataChunks || 0);
        ecLevelSelect.value = preset.qrOptions.errorCorrectionLevel;
      }

      function ensureSender() {
        if (!sender) {
          sender = new AnimatedQrSender({
            canvas,
            chunkByteSize: Number(chunkSizeInput.value),
            frameIntervalMs: Number(frameMsInput.value),
            symbolsPerFrame: Number(symbolsPerFrameInput.value)
          });
          sender.on("prepared", (payload) => {
            status.textContent = createPreparedSummary(payload);
          });
          sender.on("frame", (payload) => {
            status.textContent = `sending session=${payload.sessionId}, frame=${payload.frameIndex + 1}`;
          });
          sender.on("stop", () => {
            status.textContent = "status: stopped";
          });
          sender.on("error", ({ error }) => {
            status.textContent = `error: ${error?.message ?? String(error)}`;
          });
        }
        sender.chunkByteSize = Number(chunkSizeInput.value);
        sender.frameIntervalMs = Number(frameMsInput.value);
        sender.symbolsPerFrame = Number(symbolsPerFrameInput.value);
        sender.parityBlockDataChunks = Number(parityBlockInput.value);
        sender.qrOptions.errorCorrectionLevel = ecLevelSelect.value;
      }

      presetSelect.addEventListener("change", () => {
        applyPreset(presetSelect.value);
      });

      applyPreset(presetSelect.value);

      prepareBtn.addEventListener("click", async () => {
        const file = fileInput.files?.[0];
        if (!file) {
          status.textContent = "ファイルを選択してください";
          return;
        }
        ensureSender();
        await sender.prepare(file, {
          chunkByteSize: Number(chunkSizeInput.value),
          symbolsPerFrame: Number(symbolsPerFrameInput.value),
          parityBlockDataChunks: Number(parityBlockInput.value)
        });
      });

      startBtn.addEventListener("click", async () => {
        if (!sender?.prepared) {
          status.textContent = "先に Prepare を実行してください";
          return;
        }
        await sender.start();
      });

      stopBtn.addEventListener("click", () => {
        sender?.stop();
      });
    </script>
  </body>
</html>
