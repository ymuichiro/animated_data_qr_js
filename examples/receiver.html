<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated QR Receiver</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f2f5f8;
        color: #111;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px;
      }
      video {
        width: 100%;
        max-width: 640px;
        border: 1px solid #ccc;
        background: #000;
      }
      .row {
        margin: 12px 0;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      button, a {
        padding: 10px 16px;
      }
      #download {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>受信モード</h1>
      <p>送信側の animated QR 画面をカメラで読み取ります。</p>
      <video id="video" autoplay muted playsinline></video>
      <div class="row">
        <button id="startCameraBtn">Start Camera + Scan</button>
        <button id="stopBtn">Stop</button>
      </div>
      <p id="status">status: idle</p>
      <a id="download">Download</a>
    </main>

    <script type="module">
      import { AnimatedQrReceiver, createDownloadLink } from "../dist/animated-data-qr.esm.js";

      const video = document.getElementById("video");
      const startCameraBtn = document.getElementById("startCameraBtn");
      const stopBtn = document.getElementById("stopBtn");
      const status = document.getElementById("status");
      const download = document.getElementById("download");

      const receiver = new AnimatedQrReceiver({
        video,
        scanIntervalMs: 100
      });

      receiver.on("scan-start", () => {
        status.textContent = "status: scanning";
      });

      receiver.on("progress", (payload) => {
        status.textContent = `receiving: ${payload.receivedChunks}/${payload.totalChunks} (${Math.round(payload.ratio * 100)}%)`;
      });

      receiver.on("complete", (result) => {
        const { url, anchor } = createDownloadLink(result, download);
        anchor.textContent = `Download ${result.fileName} (${result.size} bytes)`;
        anchor.style.display = "";
        anchor.addEventListener("click", () => {
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        }, { once: true });
        status.textContent = "status: complete";
      });

      receiver.on("error", ({ error }) => {
        status.textContent = `error: ${error?.message ?? String(error)}`;
      });

      startCameraBtn.addEventListener("click", async () => {
        download.style.display = "none";
        await receiver.start();
      });

      stopBtn.addEventListener("click", () => {
        receiver.stop();
        receiver.stopCamera();
        status.textContent = "status: stopped";
      });
    </script>
  </body>
</html>
